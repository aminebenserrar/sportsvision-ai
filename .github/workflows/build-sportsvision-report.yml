name: Build SportsVision report PDF

on:
  push:
    paths:
      - "rapport/*.tex"
      - "rapport/prepare_logos.py"
      - ".github/workflows/build-sportsvision-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image preparation dependencies
        run: python -m pip install --quiet requests beautifulsoup4 Pillow PyMuPDF

      - name: Prepare logo images
        run: python rapport/prepare_logos.py

      - name: Compile report (two LaTeX passes)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: rapport_sportsvision.tex
          working_directory: rapport
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Compile B1 revision sheet (two LaTeX passes)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: fiche_comprendre_sportsvision.tex
          working_directory: rapport
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error

      - name: Publish B1 revision PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-Fiche-Comprendre-B1
          path: rapport/fiche_comprendre_sportsvision.pdf
          if-no-files-found: error

      - name: Publish PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-Rapport-PDF
          path: rapport/rapport_sportsvision.pdf
          if-no-files-found: error

      - name: Commit generated PDF for easy download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapport/rapport_sportsvision.pdf rapport/fiche_comprendre_sportsvision.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build latest SportsVision report PDF"
            git pull --rebase origin main
            git push
          fi
