name: Build Soutenance Revision Sheet

on:
  push:
    paths:
      - "revision/fiche_revision_soutenance.tex"
      - ".github/workflows/build-revision.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile revision sheet
        uses: xu-cheng/latex-action@v3
        with:
          root_file: fiche_revision_soutenance.tex
          working_directory: revision
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: SportsVision-Fiche-Revision
          path: revision/fiche_revision_soutenance.pdf
          if-no-files-found: error
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revision/fiche_revision_soutenance.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build concise revision PDF"
            git pull --rebase origin main
            git push
          fi
